<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>准星位置检查工具</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #0f0;
        }
        input[type="file"] {
            padding: 10px;
            margin: 20px 0;
        }
        #canvas-container {
            position: relative;
            display: inline-block;
            margin: 20px 0;
            border: 2px solid #0f0;
        }
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }
        #info {
            margin-top: 20px;
            padding: 15px;
            background: #222;
            border: 1px solid #0f0;
            color: #0f0;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.8;
        }
        .instructions {
            background: #2a2a2a;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 3px solid #0f0;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CS2 准星位置检查工具</h1>
        
        <div class="instructions">
            <strong>使用方法：</strong>
            <ol>
                <li>选择一张描点图(crosshair)截图</li>
                <li>工具会自动在图片正中心画出十字线（绿色）</li>
                <li>查看游戏内的准星是否与十字线重合</li>
                <li>如果不重合，说明截图或游戏设置有问题</li>
            </ol>
        </div>
        
        <input type="file" id="imageInput" accept="image/*" />
        
        <div id="canvas-container">
            <canvas id="myCanvas"></canvas>
        </div>
        
        <div id="info">
            <div>图片尺寸：等待上传...</div>
            <div>中心坐标：(960, 720)</div>
            <div style="margin-top: 10px; color: #ff0;">提示：绿色十字线就是准星应该的位置</div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // 设置canvas尺寸
                    canvas.width = img.width;
                    canvas.height = img.height;

                    // 绘制图片
                    ctx.drawImage(img, 0, 0);

                    // 绘制中心十字线
                    const centerX = img.width / 2;
                    const centerY = img.height / 2;
                    const lineLength = 100;

                    ctx.strokeStyle = '#00FF00';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]); // 虚线

                    // 竖线
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY - lineLength);
                    ctx.lineTo(centerX, centerY + lineLength);
                    ctx.stroke();

                    // 横线
                    ctx.beginPath();
                    ctx.moveTo(centerX - lineLength, centerY);
                    ctx.lineTo(centerX + lineLength, centerY);
                    ctx.stroke();

                    // 中心点（红色圆点）
                    ctx.setLineDash([]);
                    ctx.fillStyle = '#FF0000';
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // 更新信息
                    info.innerHTML = `
                        <div>文件名：${file.name}</div>
                        <div>图片尺寸：${img.width}x${img.height}</div>
                        <div>中心坐标：(${centerX.toFixed(0)}, ${centerY.toFixed(0)})</div>
                        <div style="margin-top: 10px; color: #0f0;">
                            ✓ 绿色虚线+红点 = 游戏内准星应该的位置<br>
                            如果游戏内的准星与之重合，说明截图和游戏设置都正确
                        </div>
                    `;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
