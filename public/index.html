<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CS2 职业道具库 - 收录职业选手比赛中的道具投掷">
    <title>Yuuko CS2 道具库</title>
    
    <!-- 网站图标 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#/" class="nav-logo">Yuuko CS2</a>
            <div class="nav-links">
                <a href="#/maps" class="nav-link">地图</a>
                <a href="#/utilities" class="nav-link">道具</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- 加载状态 -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>

        <!-- 首页视图 -->
        <div id="home-view" style="display: none;">
            <div class="home-hero">
                <h1 class="home-title">CS2 道具库</h1>
                <p class="home-subtitle">一键导出Demo道具投掷方法</p>
                
                <div class="home-search-box">
                    <input 
                        type="text" 
                        id="home-search" 
                        class="home-search-input" 
                        placeholder="搜索道具名称..."
                    >
                    <button id="home-search-btn" class="home-search-btn">搜索</button>
                </div>
            </div>
        </div>

        <!-- 地图选择视图 -->
        <div id="maps-view" style="display: none;">
            <div class="page-header">
                <h2 class="page-title">选择地图</h2>
                <p class="page-subtitle">选择一个地图查看道具</p>
            </div>
            
            <div id="maps-grid" class="maps-grid"></div>
        </div>

        <!-- 道具列表视图 -->
        <div id="utilities-view" style="display: none;">
            <div class="page-header">
                <h2 class="page-title" id="utilities-title">所有道具</h2>
            </div>
            
            <!-- 筛选器 -->
            <div class="utilities-filters">
                <!-- 道具类型选择 -->
                <div class="filter-group">
                    <label>类型：</label>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-type="all">全部</button>
                        <button class="filter-btn" data-type="smoke">烟雾</button>
                        <button class="filter-btn" data-type="flashbang">闪光</button>
                        <button class="filter-btn" data-type="hegrenade">手雷</button>
                        <button class="filter-btn" data-type="molotov">燃烧</button>
                        <button class="filter-btn" data-type="incendiary">燃烧</button>
                    </div>
                </div>

                <!-- 搜索框 -->
                <div class="filter-group">
                    <input 
                        type="text" 
                        id="utilities-search" 
                        class="utilities-search-input" 
                        placeholder="搜索道具名称..."
                    >
                </div>

                <!-- 统计信息 -->
                <div class="utilities-stats" id="utilities-stats"></div>
            </div>

            <!-- 道具网格 -->
            <div id="utilities-grid" class="utilities-grid"></div>

            <!-- 空状态 -->
            <div id="utilities-empty" class="empty-state" style="display: none;">
                <p>😢 没有找到符合条件的道具</p>
            </div>
        </div>

        <!-- 详情视图 -->
        <div id="detail-view" style="display: none;">
            <div id="detail-content"></div>
        </div>
    </div>

    <!-- 图片查看器模态框 -->
    <div id="image-viewer-modal" class="image-viewer-modal">
        <div class="image-viewer-header">
            <span class="image-viewer-title" id="viewer-title">图片查看</span>
            <button class="image-viewer-close" onclick="closeImageViewer()">&times;</button>
        </div>
        
        <div class="image-viewer-body">
            <!-- 左侧：图片显示区域 -->
            <div class="image-viewer-canvas">
                <div class="image-container" id="image-container">
                    <img id="viewer-image" src="" alt="">
                    <!-- 准星SVG覆盖层 -->
                    <svg id="crosshair-svg" class="crosshair-svg"></svg>
                </div>
                
                <!-- 缩放控制 -->
                <div class="zoom-controls">
                    <button class="zoom-btn" onclick="zoomOut()">-</button>
                    <span class="zoom-level" id="zoom-level">100%</span>
                    <button class="zoom-btn" onclick="zoomIn()">+</button>
                    <button class="zoom-btn" onclick="resetZoom()">重置</button>
                </div>
            </div>
            
            <!-- 右侧：准星设置面板（仅准星图显示） -->
            <div class="crosshair-settings" id="crosshair-settings">
                <h3>⊕ 准星设置</h3>
                
                <div class="setting-group">
                    <label>准星样式</label>
                    <div class="crosshair-style-picker">
                        <button class="style-btn" data-style="dot" onclick="setCrosshairStyle('dot')" title="仅中心点">
                            ●
                        </button>
                        <button class="style-btn active" data-style="small" onclick="setCrosshairStyle('small')" title="小准星">
                            +
                        </button>
                        <button class="style-btn" data-style="large" onclick="setCrosshairStyle('large')" title="大准星">
                            ✚
                        </button>
                    </div>
                </div>
                
                <div class="setting-group" id="setting-size">
                    <label>大小: <span id="size-value">20</span></label>
                    <input type="range" id="crosshair-size" min="10" max="50" value="20" oninput="updateCrosshair()">
                </div>
                
                <div class="setting-group" id="setting-thickness">
                    <label>厚度: <span id="thickness-value">2</span></label>
                    <input type="range" id="crosshair-thickness" min="1" max="6" value="2" oninput="updateCrosshair()">
                </div>
                
                <div class="setting-group" id="setting-gap">
                    <label>间隙: <span id="gap-value">4</span></label>
                    <input type="range" id="crosshair-gap" min="0" max="20" value="4" oninput="updateCrosshair()">
                </div>
                
                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="crosshair-dot" onchange="updateCrosshair()" checked>
                        显示中心点
                    </label>
                </div>
                
                <div class="setting-group">
                    <label>中心点大小: <span id="dot-size-value">2</span></label>
                    <input type="range" id="dot-size" min="1" max="8" value="2" oninput="updateCrosshair()">
                </div>
                
                <div class="setting-group">
                    <label>红色 (R): <span id="color-r-value">0</span></label>
                    <input type="range" id="color-r" min="0" max="255" value="0" oninput="updateCrosshairColor()">
                </div>
                
                <div class="setting-group">
                    <label>绿色 (G): <span id="color-g-value">255</span></label>
                    <input type="range" id="color-g" min="0" max="255" value="255" oninput="updateCrosshairColor()">
                </div>
                
                <div class="setting-group">
                    <label>蓝色 (B): <span id="color-b-value">0</span></label>
                    <input type="range" id="color-b" min="0" max="255" value="0" oninput="updateCrosshairColor()">
                </div>
                
                <div class="setting-group">
                    <label>颜色预览</label>
                    <div id="color-preview" style="width: 100%; height: 30px; border-radius: 4px; border: 2px solid var(--border); background: rgb(0, 255, 0);"></div>
                </div>
                
                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="crosshair-outline" onchange="updateCrosshair()">
                        显示轮廓
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
